<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xl-diff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8fa;
    --card: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, Segoe UI, sans-serif;
    background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 320px);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(140, 149, 159, 0.15);
    padding: 40px;
    width: 100%;
    max-width: 480px;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo-badge {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 15px;
  }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 28px; }
  .drop {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 18px;
    transition: border-color .15s, background .15s;
  }
  .drop:hover { border-color: var(--accent); background: #f8faff; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 20px; }
  label span.tag {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px;
    border-radius: 999px; margin-left: 6px; color: white;
  }
  .tag.base { background: #cf222e; }
  .tag.compare { background: #1a7f37; }
  input[type=file] {
    display: block; margin-top: 8px; width: 100%; font-size: 13px;
    padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
  }
  input[type=text] {
    display: block; margin-top: 8px; width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-top: 18px; }
  .field-label { font-weight: 600; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  button {
    margin-top: 28px; width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white; border: 0; padding: 12px 16px; border-radius: 9px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 6px rgba(37,99,235,.35);
    transition: transform .1s, box-shadow .15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,.45); }
  button:active { transform: translateY(0); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-badge">X</div>
      <h1>xl-diff</h1>
    </div>
    <p class="sub">Compare two spreadsheets with a GitHub-style split diff.</p>

    <form action="/diff" method="post" enctype="multipart/form-data">
      <div class="drop">
        <label>Base file <span class="tag base">OLD</span>
          <input type="file" name="left" accept=".xlsx,.xls,.xlsm,.csv" required>
        </label>
        <label style="margin-bottom:0">Compare file <span class="tag compare">NEW</span>
          <input type="file" name="right" accept=".xlsx,.xls,.xlsm,.csv" required>
        </label>
      </div>

      <label style="display:flex;align-items:center;gap:8px;margin-top:20px;font-weight:500;font-size:13px;cursor:pointer;">
        <input type="checkbox" name="header" value="1" style="width:auto;margin:0;">
        First row is a header
      </label>
      <div class="hint" style="margin-top:2px;">Off by default: every row is diffed as data (columns shown as A, B, C...), so no row is ever hidden.</div>

      <div class="field">
        <div class="field-label">Row key column <span style="font-weight:400;color:var(--muted)">(optional)</span></div>
        <input type="text" name="key" placeholder="header name, or A/B/C if no header">
        <div class="hint">Matches rows by this column's value instead of row position.</div>
      </div>

      <button type="submit">Compare files</button>
    </form>
  </div>
</body>
</html>
