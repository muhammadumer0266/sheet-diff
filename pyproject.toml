[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xl-diff"
version = "0.1.0"
description = "Concise spreadsheet diff utility (CSV/XLSX)"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Muhammad Umer" } ]
dependencies = ["pandas>=1.5", "openpyxl>=3.0"]

[project.optional-dependencies]
web = ["flask>=2.0"]
remote = ["fsspec>=2023.1", "s3fs>=2023.1", "adlfs>=2023.1"]
all = ["xl-diff[web,remote]"]

[project.scripts]
xldiff-web = "sheetdiff.webapp:main"

[tool.setuptools.packages.find]
include = ["sheetdiff", "sheetdiff.*"]
